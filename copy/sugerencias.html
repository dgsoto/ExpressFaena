
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugerencias | Express Faena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-gray-100 hidden">

    <header class="bg-black p-6 shadow-md sticky top-0 z-50 rounded-b-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-white text-center">💡 SUGERENCIAS DE CLIENTES</h1>
             <a href="control_total.html" class="text-sm text-white hover:text-yellow-400 flex items-center gap-2">
                <i class="fas fa-tachometer-alt"></i> Volver al Control Total
            </a>
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-4xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-4">Listado de Sugerencias</h2>
            <p class="text-sm text-gray-600 mb-4">Aquí puedes ver las sugerencias de tus clientes, agrupadas por popularidad. Decide si quieres agregarlas como un nuevo producto o eliminarlas de la lista.</p>
            <div id="sugerencias-lista" class="space-y-3 max-h-[70vh] overflow-y-auto pr-2">
                <!-- Las sugerencias se cargarán aquí -->
            </div>
             <div id="loading-state" class="p-6 text-center text-gray-500">
                <i class="fas fa-spinner fa-spin mr-2"></i>Cargando sugerencias...
            </div>
        </div>
    </main>

    <script type="module" src="auth_guard.js"></script>
    <script type="module" src="sugerencias.js"></script>
</body>
</html>
