<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | Express Faena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-black p-6 shadow-md sticky top-0 z-50 rounded-b-2xl">
        <h1 class="text-2xl font-black text-white text-center">📊 REPORTES DE INTENCIÓN DE COMPRA</h1>
    </header>

    <main class="p-4 md:p-8 max-w-7xl mx-auto space-y-8">

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                <h3 class="text-lg font-semibold text-gray-600">Ingresos Totales (Potencial)</h3>
                <p id="total-revenue" class="text-3xl font-bold text-gray-900 mt-2">$0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                <h3 class="text-lg font-semibold text-gray-600">Nº de Artículos "Vendidos"</h3>
                <p id="total-items-sold" class="text-3xl font-bold text-gray-900 mt-2">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm text-center">
                <h3 class="text-lg font-semibold text-gray-600">Producto Más Popular</h3>
                <p id="top-product" class="text-3xl font-bold text-gray-900 mt-2">-</p>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">

            <!-- Left Column: Product Ranking -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm">
                <h2 class="text-xl font-bold mb-4">Ranking de Productos Más Populares</h2>
                <div id="product-ranking-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                    <!-- Ranking will be loaded here -->
                </div>
            </div>

            <!-- Right Column: Charts -->
            <div class="lg:col-span-3 bg-white p-6 rounded-2xl shadow-sm">
                <h2 class="text-xl font-bold mb-4">Análisis Visual de Ventas</h2>
                 <div class="w-full h-96 mx-auto">
                    <canvas id="sales-chart"></canvas>
                </div>
            </div>

        </div>

    </main>

    <script type="module" src="reportes.js"></script>
</body>
</html>
