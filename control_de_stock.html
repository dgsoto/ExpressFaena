<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock | Express Faena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-black p-6 shadow-md sticky top-0 z-50 rounded-b-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-white text-center">📦 CONTROL DE STOCK</h1>
            <a href="control_total.html" class="text-sm text-white hover:text-yellow-400 flex items-center gap-2">
                <i class="fas fa-tachometer-alt"></i> Volver al Control Total
            </a>
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-7xl mx-auto">

        <!-- Controles y Filtros -->
        <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 flex flex-col md:flex-row gap-4 items-center">
            <div class="relative flex-grow w-full md:w-auto">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Buscar por nombre..." class="w-full border border-gray-300 rounded-lg shadow-sm pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="flex gap-2">
                <label class="text-sm font-medium text-gray-700">Filtrar por estado:</label>
                <select id="filter-select" class="border border-gray-300 rounded-lg shadow-sm py-2 px-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    <option value="all">Todos</option>
                    <option value="saludable">Saludable (Verde)</option>
                    <option value="bajo">Bajo (Amarillo)</option>
                    <option value="critico">Crítico (Rojo)</option>
                </select>
            </div>
        </div>

        <!-- Tabla de Productos -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3">Producto</th>
                            <th scope="col" class="px-6 py-3 text-center">Stock Actual</th>
                            <th scope="col" class="px-6 py-3 text-center">Estado</th>
                            <th scope="col" class="px-6 py-3 text-center">Ajuste Manual</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body">
                        <!-- Las filas de productos se insertarán aquí dinámicamente -->
                        <!-- Ejemplo de Fila (para referencia) -->
                        <!-- 
                        <tr>
                            <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap flex items-center gap-3">
                                <img src="https://via.placeholder.com/40" class="w-10 h-10 rounded-md object-cover">
                                <span>Nombre del Producto</span>
                            </td>
                            <td class="px-6 py-4 text-center text-lg font-bold">50</td>
                            <td class="px-6 py-4 text-center">
                                <span class="px-3 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">Saludable</span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <div class="flex justify-center items-center gap-2">
                                    <button class="w-8 h-8 bg-red-500 text-white rounded-full font-bold text-lg hover:bg-red-600 transition">-</button>
                                    <button class="w-8 h-8 bg-green-500 text-white rounded-full font-bold text-lg hover:bg-green-600 transition">+</button>
                                </div>
                            </td>
                        </tr> 
                        -->
                    </tbody>
                </table>
            </div>
            <div id="loading-state" class="p-6 text-center text-gray-500">
                <i class="fas fa-spinner fa-spin mr-2"></i>Cargando inventario...
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast-notification" class="hidden fixed top-24 right-8 bg-green-600 text-white text-sm font-bold px-4 py-3 rounded-lg shadow-lg z-50"></div>

    <script type="module" src="control_de_stock.js"></script>
</body>
</html>
