<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores | Express Faena</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚛</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>

<body class="bg-gray-100 font-sans">

    <header class="bg-black p-6 shadow-md sticky top-0 z-50 rounded-b-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-white text-center">🚛 GESTIÓN DE PROVEEDORES</h1>
            <a href="control_total.html" class="text-sm text-white hover:text-orange-400 flex items-center gap-2">
                <i class="fas fa-tachometer-alt"></i> Volver al Menú
            </a>
        </div>
    </header>

    <main class="p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">

        <!-- Columna del Formulario -->
        <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm h-fit lg:sticky top-28">
            <h2 id="form-title" class="text-xl font-bold mb-4">Agregar Proveedor</h2>
            <form id="provider-form" class="space-y-4">
                <input type="hidden" id="provider-id">

                <div>
                    <label for="provider-name" class="block text-sm font-medium text-gray-700">Nombre o Empresa</label>
                    <input type="text" id="provider-name" placeholder="Ej: Distribuidora CCU"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm"
                        required>
                </div>

                <div>
                    <label for="provider-phone" class="block text-sm font-medium text-gray-700">Teléfono /
                        Contacto</label>
                    <input type="text" id="provider-phone" placeholder="Ej: +569 1234 5678"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm">
                </div>

                <div>
                    <label for="provider-category" class="block text-sm font-medium text-gray-700">Categoría Principales
                        Múltiples</label>
                    <input type="text" id="provider-category" placeholder="Ej: Bebidas, Snacks"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm"
                        required>
                </div>

                <div>
                    <label for="provider-days" class="block text-sm font-medium text-gray-700">Días de Entrega o
                        Visita</label>
                    <input type="text" id="provider-days" placeholder="Ej: Lunes y Jueves"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm">
                </div>

                <div>
                    <label for="provider-notes" class="block text-sm font-medium text-gray-700">Notas / Condiciones de
                        Venta</label>
                    <textarea id="provider-notes" rows="3" placeholder="Ej: Pedido mínimo de $50.000, pagan al contado."
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-orange-500 focus:border-orange-500 sm:text-sm"></textarea>
                </div>

                <div class="flex gap-2">
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-orange-600 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">Guardar
                        Proveedor</button>
                    <button type="button" id="cancel-edit"
                        class="hidden w-full flex justify-center py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Columna de la Lista -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-4">Directorio de Proveedores</h2>
            <div id="providers-list" class="space-y-3 max-h-[80vh] overflow-y-auto pr-2">
                <!-- Los proveedores se cargarán dinámicamente -->
            </div>
        </div>
    </main>

    <script type="module" src="proveedores.js?v=1.0"></script>
</body>

</html>
