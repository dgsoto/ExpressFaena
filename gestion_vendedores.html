
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Vendedores | Express Faena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👥</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans hidden">

    <header class="bg-black p-6 shadow-md sticky top-0 z-50 rounded-b-2xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-white text-center">👥 GESTIÓN DE VENDEDORES</h1>
            <a href="control_total.html" class="text-sm text-white hover:text-yellow-400 flex items-center gap-2">
                <i class="fas fa-tachometer-alt"></i> Volver al Control Total
            </a>
        </div>
    </header>

    <main class="p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">

        <!-- Columna del Formulario para Crear Vendedor -->
        <div id="form-container" class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm h-fit lg:sticky top-28">
            <h2 class="text-xl font-bold mb-4">Crear Nueva Cuenta de Vendedor</h2>
            <form id="create-seller-form" class="space-y-4">
                <div>
                    <label for="seller-email" class="block text-sm font-medium text-gray-700">Email del Vendedor</label>
                    <input type="email" id="seller-email" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>

                <div>
                    <label for="seller-password" class="block text-sm font-medium text-gray-700">Contraseña Temporal</label>
                    <input type="password" id="seller-password" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                </div>
                
                <button type="submit" id="create-seller-btn" class="w-full flex justify-center items-center gap-2 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    <span id="button-text">Crear Vendedor</span>
                    <i id="button-spinner" class="fas fa-spinner fa-spin hidden"></i>
                </button>
                 <p id="error-message" class="text-red-500 text-sm mt-2"></p>
            </form>
        </div>

        <!-- Columna de la Lista de Vendedores -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-4">Vendedores Actuales</h2>
            <div id="sellers-list" class="space-y-3 max-h-[70vh] overflow-y-auto pr-2">
                <!-- Los vendedores se cargarán aquí -->
                <p class="text-center text-gray-500">Cargando lista de vendedores...</p>
            </div>
        </div>
    </main>
    
    <div id="admin-only-blocker" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-[999] flex-col items-center justify-center text-center p-8 hidden">
        <i class="fas fa-shield-halved fa-5x text-red-500 mb-4"></i>
        <h2 class="text-3xl font-black text-white mb-2">Acceso Denegado</h2>
        <p class="text-xl text-gray-300 mb-6">Esta sección es exclusiva para administradores.</p>
        <a href="control_total.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg flex items-center gap-2 transition-colors text-lg">
            <i class="fas fa-tachometer-alt"></i>
            <span>Volver al Centro de Comando</span>
        </a>
    </div>

    <script type="module" src="auth_guard.js"></script>
    <script type="module" src="gestion_vendedores.js"></script>

</body>
</html>
