
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Express Faena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <header class="bg-black p-6 shadow-md sticky top-0 z-50 rounded-b-2xl">
        <h1 class="text-2xl font-black text-white text-center">🏪 ADMIN EXPRESS FAENA</h1>
    </header>

    <main class="p-4 md:p-8 max-w-4xl mx-auto space-y-8">

        <!-- Formulario para Agregar/Editar Producto -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-4">Agregar/Editar Producto</h2>
            <form id="product-form" class="space-y-4">
                <input type="hidden" id="product-id">
                <div>
                    <label for="product-name" class="block text-sm font-medium text-gray-700">Nombre del Producto</label>
                    <input type="text" id="product-name" class="mt-1 w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-[#facc15]" placeholder="Ej: Coca-Cola 1L" required>
                </div>
                <div>
                    <label for="product-price" class="block text-sm font-medium text-gray-700">Precio del Producto</label>
                    <input type="number" id="product-price" class="mt-1 w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-[#facc15]" placeholder="Ej: 3000" required>
                </div>
                <div>
                    <label for="product-video" class="block text-sm font-medium text-gray-700">URL del Video (Opcional)</label>
                    <input type="text" id="product-video" class="mt-1 w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-[#facc15]" placeholder="https://ejemplo.com/video.mp4">
                </div>
                <div>
                    <label for="product-images" class="block text-sm font-medium text-gray-700">URLs de Imágenes (una por línea, máx. 15)</label>
                    <textarea id="product-images" rows="8" class="mt-1 w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-[#facc15]" placeholder="https://ejemplo.com/imagen1.jpg\nhttps://ejemplo.com/imagen2.jpg\n..."></textarea>
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="submit" class="w-full bg-black text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition-colors">Guardar Producto</button>
                    <button type="button" id="cancel-edit" onclick="window.resetForm()" class="hidden w-full bg-gray-200 py-3 rounded-lg font-bold">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Lista de Productos -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-4">Productos Existentes</h2>
            <div id="products-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-2">
                <!-- Los productos se cargarán aquí -->
            </div>
        </div>

    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
