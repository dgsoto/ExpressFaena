
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Express Faena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">

    <header class="bg-black p-6 shadow-md sticky top-0 z-50 rounded-b-2xl">
        <h1 class="text-2xl font-black text-white text-center">⚙️ ADMIN DE PRODUCTOS</h1>
    </header>

    <main class="p-4 grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- Columna de Formulario y Vista Previa -->
        <div class="space-y-8">
            <!-- Formulario para Agregar/Editar Producto -->
            <div class="bg-white p-6 rounded-2xl shadow-sm">
                <h2 class="text-xl font-bold mb-4">Agregar Nuevo Producto</h2>
                <form id="product-form" class="space-y-4">
                    <input type="hidden" id="product-id">
                    <div>
                        <label for="product-name" class="block text-sm font-medium text-gray-700">Nombre</label>
                        <input type="text" id="product-name" class="mt-1 w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-[#facc15]" placeholder="Ej: Coca-Cola 500ml">
                    </div>
                    <div>
                        <label for="product-price" class="block text-sm font-medium text-gray-700">Precio</label>
                        <input type="number" id="product-price" class="mt-1 w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-[#facc15]" placeholder="Ej: 1500">
                    </div>
                    <div>
                        <label for="product-image" class="block text-sm font-medium text-gray-700">URL de Imagen</label>
                        <input type="url" id="product-image" class="mt-1 w-full p-3 bg-gray-50 rounded-lg outline-none focus:ring-2 focus:ring-[#facc15]" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="w-full bg-black text-white py-3 rounded-lg font-bold hover:bg-gray-800 transition-colors">Guardar Producto</button>
                        <button type="button" id="cancel-edit" class="hidden w-full bg-gray-200 py-3 rounded-lg font-bold">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Vista Previa -->
            <div class="bg-white p-6 rounded-2xl shadow-sm">
                <h2 class="text-xl font-bold mb-4">Vista Previa</h2>
                <div id="product-preview-container" class="flex justify-center items-center">
                    <div class="bg-white rounded-2xl shadow-md p-4 flex flex-col items-center text-center w-48">
                        <img id="preview-image" src="https://via.placeholder.com/150?text=IMAGEN" alt="Vista previa" class="w-full h-28 object-cover rounded-lg mb-3 shadow-sm">
                        <h4 id="preview-name" class="text-sm font-bold text-gray-800 leading-tight">Nombre Producto</h4>
                        <p id="preview-price" class="text-lg font-black text-gray-900 mt-1">$0</p>
                        <button class="bg-[#facc15] w-full mt-3 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wide shadow-sm">Agregar</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Columna de Lista de Productos -->
        <div class="bg-white p-6 rounded-2xl shadow-sm">
            <h2 class="text-xl font-bold mb-4">Productos Existentes</h2>
            <div id="products-list" class="space-y-3 max-h-[70vh] overflow-y-auto pr-2">
                <!-- Los productos se cargarán aquí -->
            </div>
        </div>

    </main>

    <script type="module" src="admin.js"></script>

</body>
</html>
