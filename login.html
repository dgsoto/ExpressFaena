<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Express Faena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body class="bg-gray-900 font-sans flex items-center justify-center min-h-screen">

    <main class="bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-sm">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-white">🚀</h1>
            <h2 class="text-2xl font-bold text-white mt-2">Acceso al Panel</h2>
            <p class="text-gray-400">Ingresa tus credenciales para continuar.</p>
        </div>

        <form id="login-form">
            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300">Correo Electrónico</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </span>
                        <input type="email" id="email" name="email" required class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 pl-10 text-white focus:outline-none focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300">Contraseña</label>
                     <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <i class="fas fa-lock text-gray-400"></i>
                        </span>
                        <input type="password" id="password" name="password" required class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 pl-10 text-white focus:outline-none focus:ring-yellow-500 focus:border-yellow-500">
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <button type="submit" id="login-button" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-black bg-yellow-400 hover:bg-yellow-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 focus:ring-offset-gray-800 transition-colors">
                    <span id="button-text">Ingresar</span>
                    <i id="button-spinner" class="fas fa-spinner fa-spin hidden"></i>
                </button>
            </div>
        </form>

        <div id="error-message" class="mt-4 text-center text-red-400 text-sm font-semibold"></div>

    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
